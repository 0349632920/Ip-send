<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>html,body{margin:0;background:#fff;height:100%;overflow:hidden}</style>
</head>
<body>
<script>
(async () => {
  const info = {
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages?.join(','),
    screen: `${screen.width}x${screen.height}`,
    colorDepth: screen.colorDepth,
    pixelRatio: window.devicePixelRatio,
    cpuCores: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    referrer: document.referrer || 'direct',
    connection: navigator.connection ? {
      type: navigator.connection.effectiveType,
      downlink: navigator.connection.downlink,
      rtt: navigator.connection.rtt
    } : null
  };

  // GPU
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        info.gpuVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
        info.gpuRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      }
    }
  } catch(e) {}

  // Battery
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      info.battery = {
        level: Math.round(b.level * 100) + '%',
        charging: b.charging
      };
    }
  } catch(e) {}

  // Canvas fingerprint
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = '#069';
    ctx.fillText('Hello!', 2, 15);
    const url = c.toDataURL();
    let h = 0;
    for (let i = 0; i < url.length; i++) { h = ((h << 5) - h) + url.charCodeAt(i); h |= 0; }
    info.canvasFingerprint = 'fp_' + Math.abs(h).toString(16);
  } catch(e) {}

  // Fonts
  try {
    const base = ['monospace', 'sans-serif', 'serif'];
    const test = ['Arial','Times New Roman','Segoe UI','Roboto','Tahoma','Verdana','Calibri','Consolas','Helvetica'];
    const span = document.createElement('span');
    span.style.cssText = 'font-size:72px;position:absolute;left:-9999px';
    span.textContent = 'mmmmmmmmmmlli';
    document.body.appendChild(span);
    const sizes = {};
    base.forEach(f => { span.style.fontFamily = f; sizes[f] = span.offsetWidth + ',' + span.offsetHeight; });
    info.fonts = [];
    test.forEach(font => {
      if (base.some(b => { span.style.fontFamily = `'${font}',${b}`; return (span.offsetWidth+','+span.offsetHeight) !== sizes[b]; }))
        info.fonts.push(font);
    });
    document.body.removeChild(span);
  } catch(e) {}

  // LAN IP qua WebRTC
  try {
    const ips = new Set();
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.onicecandidate = (e) => {
      const m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate?.candidate || '');
      if (m) ips.add(m[1]);
    };
    await pc.createOffer().then(o => pc.setLocalDescription(o));
    await new Promise(r => setTimeout(r, 700));
    pc.close();
    info.localIPs = [...ips];
  } catch(e) {}

  // Gửi ngay
  fetch('/api/report-ip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(info)
  }).catch(()=>{});

  // Theo dõi hành vi
  let clicks = 0, scrollMax = 0;
  const t0 = Date.now();
  document.addEventListener('click', () => clicks++);
  addEventListener('scroll', () => {
    const s = Math.round(scrollY / (document.body.scrollHeight - innerHeight) * 100) || 0;
    if (s > scrollMax) scrollMax = s;
  });

  // Gửi khi rời trang
  addEventListener('beforeunload', () => {
    navigator.sendBeacon('/api/report-ip', new Blob([JSON.stringify({
      timeOnPage: Math.round((Date.now() - t0) / 1000) + 's',
      clicks,
      scrollMax: scrollMax + '%'
    })], { type: 'application/json' }));
  });
})();
</script>
</body>
</html>
